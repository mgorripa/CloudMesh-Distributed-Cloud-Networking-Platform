apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudmeshnetworks.networking.cloudmesh.io
spec:
  group: networking.cloudmesh.io
  scope: Namespaced
  names:
    plural: cloudmeshnetworks
    singular: cloudmeshnetwork
    kind: CloudMeshNetwork
    shortNames: [cmn]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Proxy
      type: string
      jsonPath: .status.proxyService
    - name: Available
      type: integer
      jsonPath: .status.availableReplicas
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [serviceRef, loadBalancing]
            properties:
              serviceRef:
                type: object
                required: [name, portName]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 63
                    pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                  portName:
                    type: string
                    minLength: 1
                    maxLength: 15
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
              loadBalancing:
                type: object
                required: [algorithm]
                properties:
                  algorithm:
                    type: string
                    enum: [round-robin, least-connections, hash]
              replicas:
                type: integer
                minimum: 1
                maximum: 5
                default: 1
              probeIntervalSeconds:
                type: integer
                minimum: 1
                maximum: 60
                default: 2
          status:
            type: object
            properties:
              observedGeneration: {type: integer, format: int64}
              phase: {type: string, enum: [Pending, Ready, Degraded]}
              message: {type: string}
              proxyService: {type: string}
              availableReplicas: {type: integer}
